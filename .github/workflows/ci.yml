name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build application image (frozen Bun install)
        run: docker compose build api

      - name: Dependency audit
        run: >-
          docker compose run --rm --no-deps api
          bun audit

      - name: Typecheck
        run: >-
          docker compose run --rm --no-deps api
          bun run typecheck

      - name: Build
        run: >-
          docker compose run --rm --no-deps api
          bun run build

      - name: Unit tests
        run: >-
          docker compose run --rm --no-deps api
          bun run test

      - name: Start isolated PostgreSQL integration database
        run: docker compose --profile test up --detach --wait db-test

      - name: PostgreSQL integration tests
        env:
          CI_TEST_DATABASE_URL: postgres://ticketing_test:local-test-only@db-test:5432/ticketing_test
          CI_DEVELOPMENT_DATABASE_URL: postgres://ticketing:local-development-only@db:5432/ticketing
        run: >-
          docker compose run --rm --no-deps
          --env NODE_ENV=test
          --env DATABASE_URL="$CI_DEVELOPMENT_DATABASE_URL"
          --env TEST_DATABASE_URL="$CI_TEST_DATABASE_URL"
          api bun run --filter @ticketing/api test:integration

      - name: Stop containers and remove temporary database
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
